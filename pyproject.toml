[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ci"
version = "1.0.0"
description = "Autonomous Self-Healing CI/CD & Formal Verification Multi-Agent Engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TedT002" }]
keywords = ["ci-cd", "self-healing", "autonomous-agents", "formal-verification", "ast", "testing", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.6.0",
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest-cov>=4.0.0",
    "docker>=7.0.0",
]

[project.scripts]
aegis-ci = "core.orchestrator:main"

[tool.setuptools.packages.find]
include = ["core*", "tools*"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
