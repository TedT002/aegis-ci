name: Aegis-CI Verification & Test Suite

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Unit & Integration Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run test suite with coverage
        run: |
          pytest tests/ --cov=core --cov=tools --cov-report=term-missing

      - name: Verify self-healing closed-loop engine on sample failure
        run: |
          python -m core.orchestrator --log-path fixtures/sample_repo/failure.log --repo-path fixtures/sample_repo
          test -f fixtures/sample_repo/patch.diff
          test -f fixtures/sample_repo/rca_report.md
